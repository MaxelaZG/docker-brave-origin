name: _maxelazg_check_brave_updates

on:
  schedule:
    - cron: '0 */6 * * *' # Check every 6 hours
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check latest brave-origin version
        id: check_version
        run: |
          # Query Brave apt repository for latest brave-origin version
          LATEST_VER=$(curl -sL https://brave-browser-apt-release.s3.brave.com/dists/stable/main/binary-amd64/Packages.gz \
            | gunzip \
            | awk -v RS= '/Package: brave-origin/ {for(i=1;i<=NF;i++) if($i=="Version:") print $(i+1); exit}')

          if [ -z "$LATEST_VER" ]; then
            echo "::error::Could not determine latest brave-origin version"
            exit 1
          fi

          echo "Latest brave-origin version: ${LATEST_VER}"
          echo "version=${LATEST_VER}" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

          # Ensure lowercase repository path for Docker/GHCR compatibility
          IMAGE_NAME="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

          # Check if image tag exists on GHCR or if this is an explicit push/manual trigger
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Triggered by push or manual dispatch. Proceeding with build."
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            if docker manifest inspect "${IMAGE_NAME}:${LATEST_VER}" > /dev/null 2>&1; then
              echo "Version ${LATEST_VER} already built and pushed. Skipping build."
              echo "should_build=false" >> $GITHUB_OUTPUT
            else
              echo "New version ${LATEST_VER} detected. Proceeding with build."
              echo "should_build=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Set up Docker Buildx
        if: steps.check_version.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.check_version.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: steps.check_version.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.check_version.outputs.image_name }}:latest
            ${{ steps.check_version.outputs.image_name }}:${{ steps.check_version.outputs.version }}
          build-args: |
            VERSION=${{ steps.check_version.outputs.version }}
            BUILD_DATE=${{ steps.check_version.outputs.build_date }}
