name: _maxelazg_sync_upstream_repo

on:
  schedule:
    - cron: '0 3 * * *' # Runs daily at 03:00 UTC
  workflow_dispatch:     # Allows manual trigger

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Fetch and Merge Upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/linuxserver/docker-brave.git || true
          git fetch upstream master

          BEFORE_SHA=$(git rev-parse HEAD)

          # Merge upstream changes
          if ! git merge upstream/master -m "chore: sync upstream linuxserver/docker-brave"; then
            echo "::error::Merge conflict detected! Manual resolution required."
            exit 1
          fi

          AFTER_SHA=$(git rev-parse HEAD)

          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            echo "New upstream changes detected. Pushing to master..."
            git push origin master
            echo "Triggering build workflow..."
            gh workflow run _maxelazg_check_brave_updates.yml --ref master || true
          else
            echo "Already up to date with upstream."
          fi
